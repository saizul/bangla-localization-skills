name: Bug report
description: A script crashed, reported a wrong finding, or a skill gave wrong Bangla advice
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste secrets, API keys or personal data.** A minimal example (one string, one CSS
        rule, one PO entry) is the most helpful report. For wrong Bangla, include the correct form and,
        if you can, a source (Bangla Academy dictionary, style guide).
  - type: dropdown
    id: skill
    attributes:
      label: Skill
      options:
        - bangla-ui-translation
        - i18n-key-extraction
        - bangla-number-date-format
        - bangla-typography-web
        - bangla-seo-content
        - bangla-text-normalization
        - wordpress-bangla-site
        - bangla-spellcheck-style
        - validator / repository tooling
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: The command you ran, its output, and a minimal input that reproduces it.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "macOS 15, Python 3.12, Claude Code / Codex CLI"
    validations:
      required: true

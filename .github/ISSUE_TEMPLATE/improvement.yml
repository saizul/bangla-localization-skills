name: Improve a skill
description: A new rule or check, a better workflow step, a glossary term, a missing edge case or clearer docs
labels: ["enhancement"]
body:
  - type: input
    id: skill
    attributes:
      label: Skill
      placeholder: "bangla-spellcheck-style"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What should change and why?
      description: For a new rule or check, include an input that should (and one that should not) trigger it.
    validations:
      required: true
